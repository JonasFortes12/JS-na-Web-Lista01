    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 03</title>
</head>

<body>
    <script>

        const num1 = prompt("Digite o primeiro número: ")
        const num2 = prompt("Digite o segundo número: ")
        const num3 = prompt("Digite o terceiro número: ")

        /*
           // -> POSSIBILIDADES: <-
            // num1,num2,num3
            // num1,num3,num2
            // num2,num1,num3
            // num2,num3,num1
            // num3,num1,num2
            // num3,num2,num1
        
        */


        if (n1 > n2 && n2 > n3) {
            console.log(`A ordem decrescente dos números é: ${n1} ${n2} ${n3}`)
        } else if (n1 > n3 && n3 > n2) {
            console.log(`A ordem decrescente dos números é: ${n1} ${n3} ${n2}`)
        } else if (n2 > n1 && n1 > n3) {
            console.log(`A ordem decrescente dos números é: ${n2} ${n1} ${n3}`)
        } else if (n2 > n3 && n3 > n1) {
            console.log(`A ordem decrescente dos números é: ${n2} ${n3} ${n1}`)
        } else if (n3 > n1 && n1 > n2) {
            console.log(`A ordem decrescente dos números é: ${n3} ${n1} ${n2}`)
        } else if (n3 > n2 && n2 > n1) {
            console.log(`A ordem decrescente dos números é: ${n3} ${n2} ${n1}`)
        } else {
            console.log('Indisponível!')
        }



    </script>
