<body>
    <script>

        const num1 = prompt("Digite o primeiro número: ")
        const num2 = prompt("Digite o segundo número: ")
        const num3 = prompt("Digite o terceiro número: ")

        /*
            3 > 2 > 1 -> (num1>num2 && num2>num1 ) ok 
            num1, num2, num3

            1 < 2 < 3 -> (num1<num2 && num2<num3) ok
            num3, num2, num1

            2 < 3 > 1 -> (num1<num2 && num2>num3 ) ok
            num2, num1, num3

            1 < 3 > 2 -> (num1<num2 && num2>num3) ok
            num2, num3, num1

            2 > 1 < 3 -> (num1>num2 && num2<num3) ok
            num3, num1, num2

            3 > 1 < 2 -> (num1>num2 && num2<num3)
            num1, num3, num2
        
        */
        

        //(num1>num2 && num2>num1 )
        if(num1>num2 && num2>num1 ){
            alert(`Ordem Decrescente: ${num1} - ${num2} - ${num3}`)
        //     (num1<num2 && num2<num3)
        }else if(num1<num2 && num2<num3){
            alert(`Ordem Decrescente: ${num3} - ${num2} - ${num1}`)
        //       num1<num2 && num2>num3  
        }else if(num1<num2 && num2>num3 ){
            alert(`Ordem Decrescente: ${num2} - ${num3} - ${num1}`)
        //       num1<num2 && num2>num3   
        }else if(num1<num2 && num2>num3) {
            alert(`Ordem Decrescente: ${num2} - ${num3} - ${num1}`)
        //    
        }else if (num1>num2 && num2<num3){
            alert(`Ordem Decrescente: ${num1} - ${num3} - ${num2}`)
        }



    </script>
