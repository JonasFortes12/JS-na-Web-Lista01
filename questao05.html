<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 05</title>
</head>
<body>
    <script>
        // parseFloat(prompt("Digite a nota dod 1º bimestre: ")) // converter em um número quebrado 
        // parseInt()  // converter em um número inteiro
        const bimestre01 = parseFloat(prompt("Digite a nota dod 1º bimestre: "))
        const bimestre02 = parseFloat(prompt("Digite a nota dod 2º bimestre: "))
        const bimestre03 = parseFloat(prompt("Digite a nota dod 3º bimestre: "))
        const bimestre04 = parseFloat(prompt("Digite a nota dod 4º bimestre: "))

        const calculaMedia = (n1, n2, n3, n4) => {
            const resultado = (n1+n2+n3+n4) / 4

            return resultado
        }

        const resultadoMedia = calculaMedia(
            bimestre01, bimestre02, bimestre03, bimestre04
        )

        if(resultadoMedia >= 7){
            alert(`A media é ${resultadoMedia}. Aluno Aprovado!`)
        }else if(resultadoMedia < 7 && resultadoMedia>=5){
            alert(`A media é ${resultadoMedia}. Aluno Recuperação!`)
        }else {
            alert(`A media é ${resultadoMedia}. Aluno Reprovado!`)
        }


    </script>
    
</body>
</html>
